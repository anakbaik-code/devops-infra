
# rate_limitting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# limit_connection
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# limit_body_size -> batas upload size
client_max_body_size 2M;

# Mengambil IP asli pengunjung dari header X-Forwarded-For yang dikirim Cloudflare
set_real_ip_from 0.0.0.0/0; # atau IP range Cloudflare
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# proxy_cache_path <folder_simpan> keys_zone=<nama_zone>:<ukuran_ram_indeks> max_size=<max_disk> inactive=<waktu_hapus>
# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_api_cache:10m max_size=500m inactive=60m use_temp_path=off;

# Load balancer
upstream go_cluster {
    least_conn;

    # Primary Server
    server app-backend-1:8080 max_fails=2 fail_timeout=10s;
    # Second Server
    server app-backend-2:8080 max_fails=2 fail_timeout=10s;
    # Server Bckup
    server app-backend-3:8080 backup;

    # Connection Pool
    keepalive 32;
}

server {
    listen 80;
    server_name akubaikok.my.id;

    # --------------------------------------------------------------------------
    # OPTIMASI GZIP COMPRESSION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5; # Level 5 = Sweet spot (kompresi bagus, CPU irit)
    gzip_min_length 1000; # Cuma kompres file > 1KB
    gzip_proxied any; # Kompres request yang lewat proxy/tunnel
    gzip_vary on; # Tambah header Vary: Accept-Encoding

    # HANYA kompres file berbasis teks/data (JANGAN kompres gambar/video)
    gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    image/svg+xml;

    # Set Http Status Code Rate Limit Ke 429
    limit_req_status 429;
    limit_conn_status 429;

    # limit connection
    limit_conn addr_limit 25;

    # Security_Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referer-Policy "strict-origin-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Timeout
    client_header_timeout 12s;
    client_body_timeout 12s;
    send_timeout 12s;

    # 1. ASSET (Gambar/CSS/JS) ➔ Simpan di browser 7 hari (biar web cepat)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 3d;
        proxy_pass http://app-frontend:80;
    }

    location / {
        proxy_pass http://app-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # cache
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # pakai keep-alive setting di http1/1
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Proxy
        proxy_pass http://go_cluster/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # cache
        add_header Cache-Control "no-store, no-cache, private, must-revalidate" always;

        # timeout
        proxy_connect_timeout 5s;
        proxy_read_timeout 50s;
        proxy_send_timeout 50s;

        # request limit security
        limit_req zone=api_limit burst=10 nodelay;

        # request body limit
        client_max_body_size 5M;


    }

    location = /equals {
        return 200 "equals OK";
    }

    # PROTEKSI FILE SENSITIF & TERSEMBUNYI
    # --------------------------------------------------------------------------

    # 1. Blokir semua file/folder tersembunyi (.env, .git, .docker, dll.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Blokir file backup, log, & database dump (.bak, .sql, .log, .tar.gz)
    location ~* \.(bak|sql|log|old|tmp|swp|tar|gz|zip|rar)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Blokir file konfigurasi sensitif (.yml, .ini, .toml, conf)
    location ~* \.(yml|yaml|ini|toml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}