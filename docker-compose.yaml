x-version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # FRONTEND
  # ----------------------------------------------------------------------------
  app-frontend:
    build:
      context: ../frontend  # 1. Docker bakal cari Dockerfile di folder ./frontend
    container_name: fe-app # 2. Nama container ketika jalan nanti
    restart: always        # 3. Kalo container mati/crash, Docker bakal nyalain lagi otomatis

  # ----------------------------------------------------------------------------
  # GO BACKEND CLUSTER (LOAD BALANCED)
  # ----------------------------------------------------------------------------
  app-backend-1:
    build:
      context: ../backend
    container_name: app-backend-1
    restart: always
  app-backend-2:
    build:
      context: ../backend
    container_name: app-backend-2
    restart: always
  app-backend-3:
    build:
      context: ../backend
    container_name: app-backend-3
    restart: always
  # ----------------------------------------------------------------------------
  # NGINX REVERSE PROXY & LOAD BALANCER
  # ----------------------------------------------------------------------------
  nginx-proxy:
    build:
      context: ./nginx     # 1. Docker bakal cari Dockerfile di folder ./nginx
    container_name: nginx-gateway
    ports:
      - "80:80"            # 2. Buka akses dari luar (Laptop kamu port 80 -> Container Nginx port 80)
    depends_on:
      - app-frontend       # 3. Nginx HANYA bakal nyala KALAU app-frontend udah nyala duluan
      - app-backend-1
      - app-backend-2
      - app-backend-3
    restart: always
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner-lokal
    restart: always
    environment:
      - REPO_URL=https://github.com/anakbaik-code/devops-backend
      - RUNNER_TOKEN=ISI_TOKEN_DARI_GITHUB_DISINI
      - RUNNER_NAME=docker-compose-runner
      - RUNNER_WORKDIR=/tmp/github-runner
    volumes:
      # PENTING: Mount docker socket agar runner bisa jalankan perintah docker di host
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/tmp/github-runner

volumes:
  runner-data: